spring:
  application:
    name: tech-blog
  profiles:
    active: local
  autoconfigure:
    # 纯 JWT 无状态认证，排除默认内存用户（避免启动时生成随机密码）
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（生产环境务必通过环境变量覆盖 secret）
jwt:
  secret: tech-blog-jwt-secret-key-2026-please-change-in-production-0123456789abcdef
  expire-seconds: 604800
